<!doctype html><meta charset="utf-8" /><title>Planche des icônes</title
><link rel="stylesheet" href="commun.css" />
<body>
  <script src="commun.js"></script>
  <script>
    // Icônes d'équipements dessinées de zéro (2 tons : acier --sl-icon, accent --sl-icon-2) et LED d'état à double indice.
    const I = [
      ['server', 'Serveur Windows', 'tour'],
      ['linux-server', 'Serveur Linux', 'tour + badge invite'],
      ['client', 'Poste Windows', 'écran'],
      ['linux', 'Poste Linux', 'portable + invite'],
      ['switch', 'Switch', 'boîtier plat à ports'],
      ['router', 'Routeur', 'boîtier arrondi, flèches'],
      ['cloud', 'Internet', 'nuage'],
      ['firewall', 'Pare-feu', 'mur de briques']
    ]
    const Lz = [
      ['ok', 'En fonctionnement', 'rond plein'],
      ['warn', 'Dégradé / alerte', 'triangle'],
      ['down', 'Hors service / éteint', 'carré barré'],
      ['idle', 'Inactif / non configuré', 'anneau']
    ]
    document.body.insertAdjacentHTML('afterbegin', SPRITE)
    for (const th of ['dark', 'light'])
      document.body.insertAdjacentHTML(
        'beforeend',
        `<h1>Planche — thème ${th === 'dark' ? 'sombre' : 'clair'}</h1><div data-theme="${th}" style="background:var(--sl-canvas);color:var(--sl-fg);padding:20px;width:1100px;display:grid;grid-template-columns:repeat(8,1fr);gap:14px">
${I.map(([k, n, f]) => `<div style="text-align:center;font-size:12px"><div style="width:64px;height:64px;margin:auto;border:1px solid var(--sl-line-strong);border-radius:6px;background:var(--sl-surface);display:grid;place-items:center">${ic('i-' + k)}</div><b>${n}</b><div style="color:var(--sl-fg-muted);font-size:11px">${f}</div><svg style="width:48px;height:48px;margin-top:6px"><use href="#i-${k}"/></svg><svg style="width:24px;height:24px"><use href="#i-${k}"/></svg><svg style="width:16px;height:16px"><use href="#i-${k}"/></svg></div>`).join('')}
<div style="grid-column:span 2;text-align:center;font-size:12px"><div style="position:relative;width:64px;height:64px;margin:auto;border:1px solid var(--sl-line-strong);border-radius:6px;background:var(--sl-surface);display:grid;place-items:center">${ic('i-router')}<svg class="ios" style="position:absolute;top:-7px;left:16px;width:32px;height:11px"><use href="#b-ios"/></svg></div><b>Équipement Cisco (1921, 2811)</b><div style="color:var(--sl-fg-muted);font-size:11px">bandeau texte « IOS », aucun logo</div></div>
<div style="grid-column:span 6;display:flex;gap:22px;align-items:center;font-size:12px">${Lz.map(([k, n, f]) => `<div style="display:flex;gap:6px;align-items:center"><svg width="16" height="16"><use href="#l-${k}"/></svg><span><b>${n}</b><br><span style="color:var(--sl-fg-muted);font-size:11px">${f}</span></span></div>`).join('')}</div></div>`
      )
  </script>
</body>

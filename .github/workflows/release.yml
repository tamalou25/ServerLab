# Publication d'une version : sur un tag vX.Y.Z, construit l'installeur Windows (NSIS) et l'AppImage
# Linux puis les publie dans la release GitHub du tag, avec latest.yml et latest-linux.yml pour les
# mises à jour automatiques. Seul le jeton GITHUB_TOKEN du workflow est utilisé (aucun secret ajouté).
#
# Chaîne d'approvisionnement (audit S-04) : les jobs qui installent les dépendances (npm ci, sans
# scripts d'installation) n'ont qu'un jeton en lecture, non conservé par checkout ; les jobs qui
# écrivent dans la release (draft, publish) n'installent ni n'exécutent aucune dépendance.
name: Release

on:
  push:
    tags: ['v*']

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    # Même syntaxe sur les deux systèmes (Git Bash sous Windows)
    shell: bash

jobs:
  verify:
    name: Vérifications
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Version du tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Le tag $GITHUB_REF_NAME n'est pas de la forme vX.Y.Z"
            exit 1
          fi

      - name: Installation des dépendances
        run: npm ci --ignore-scripts

      - name: Lint, types et tests du moteur
        run: npm run lint && npm run typecheck && npm test

  draft:
    name: Brouillon de release
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Brouillon de release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "La release $GITHUB_REF_NAME existe déjà : les installeurs y seront ajoutés."
            exit 0
          fi
          version="${GITHUB_REF_NAME#v}"
          cat > notes.md << EOF
          ## Installation

          - **Windows** : téléchargez \`ServerLab-Setup-$version.exe\` puis lancez-le. L'installeur n'est pas signé :
            si SmartScreen s'affiche, cliquez sur « Informations complémentaires » puis « Exécuter quand même ».
          - **Linux** : téléchargez \`ServerLab-$version-x86_64.AppImage\`, rendez-le exécutable
            (\`chmod +x ServerLab-$version-x86_64.AppImage\`) puis lancez-le.

          Les versions installées se mettent à jour automatiquement (ou via Aide > Rechercher des mises à jour…).
          EOF
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "ServerLab $version" --notes-file notes.md --generate-notes

  build:
    name: Installeur ${{ matrix.label }}
    needs: draft
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows (NSIS)
            target: --win nsis
            artifact: windows
          - os: ubuntu-latest
            label: Linux (AppImage)
            target: --linux AppImage
            artifact: linux
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # Aucun script d'installation : rien ne s'exécute à l'installation des dépendances
      - name: Installation des dépendances
        run: npm ci --ignore-scripts

      # La version de l'application (À propos, mises à jour) est celle du tag
      - name: Version alignée sur le tag
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Build electron-vite
        run: npm run build

      # Sans jeton : les fichiers (installeur, blockmap, latest*.yml) sont transmis au job publish
      - name: Empaquetage
        run: npx electron-builder ${{ matrix.target }} --publish never

      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/*.AppImage
            dist/latest*.yml

  publish:
    name: Publication de la release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: assets
          merge-multiple: true

      - name: Envoi des installeurs dans la release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" assets/* --repo "$GITHUB_REPOSITORY" --clobber

      - name: Brouillon → release publiée
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Une préversion (v1.2.0-beta.1) n'est pas proposée aux mises à jour automatiques
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then kind=--prerelease; else kind=--latest; fi
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false "$kind"

# Intégration continue : lint + typecheck + tests (moteur et E2E) sur chaque push et pull request.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck et tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Installation des dépendances
        run: npm ci

      - name: Lint (ESLint + Prettier)
        run: npm run lint

      - name: Vérification des types
        run: npm run typecheck

      # Couverture du moteur : les seuils de vitest.config.ts font échouer la CI si elle baisse (audit v2.11.1, Q-01)
      - name: Tests du moteur (Vitest, avec couverture et seuils)
        run: npm run test:coverage

      - name: Build electron-vite
        run: npm run build

      - name: Tests E2E (Playwright + Electron)
        run: xvfb-run -a npx playwright test

      # Configuration electron-builder vérifiée avant toute release, puis démarrage de l'application
      # empaquetée (dépendances de production présentes, asar lisible)
      - name: Empaquetage (dossier Linux) et test de l'application empaquetée
        run: |
          npx electron-builder --linux dir --publish never
          SERVERLAB_E2E_EXECUTABLE=dist/linux-unpacked/serverlab xvfb-run -a npx playwright test smoke.spec.ts

      - name: Rapport Playwright
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
